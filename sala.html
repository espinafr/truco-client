<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truco</title>
</head>
<body>
    <header>
        <h1>Truco</h1>
        <h2>Testes iniciais</h2>
        <p class="p-1.5 bg-gray-900 text-gray-200 w-fit font-mono" id="ping-container"><span class="mx-1 font-black status-servidor-ponto" style="color: yellow;">•</span> <span class="status-servidor-text">conectando...</span> <button id="reconnect-button" class="hover:filter hover:brightness-125 cursor-pointer text-white font-bold rounded">🔄</button></p>
    </header>
    <main class="flex-1 p-5">
        <div class="w-full h-full bg-gray-300 scroll-y-auto">
            <div id="gameroom" class="grid grid-cols-[repeat(auto-fit,minmax(200px,1fr))] lg:grid-cols-4 gap-4">
                <p>Procurando salas abertas...</p>
            </div>
        </div>
    </main>
    <footer class="p-1">
        <p><a href="https://github.com/espinafr/truco-client" target="_blank" rel="noopener noreferrer">Contribua no github!</a></p>
    </footer>
    <div class="flex justify-center items-center gap-2" id="cards-display"></div>
    <script type="module" src="/src/general.ts"></script>
    <script type="module" src="/src/pages/game.ts"></script>
</body>
</html>

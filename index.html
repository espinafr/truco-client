<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truco</title>
</head>
<body class="flex flex-col justify-center">
    <header>
        <h1>Truco</h1>
        <h2>Testes iniciais</h2>
        <p class="p-1.5 bg-gray-900 text-gray-200 w-fit font-mono" id="ping-container"><span class="mx-1 font-black status-servidor-ponto" style="color: yellow;">•</span> <span class="status-servidor-text">conectando...</span></p>
    </header>
    <main class="flex-1 p-2">
        <div class="w-1/2">
            <div id="salaDeJogos" class="grid grid-cols-[repeat(auto-fit,minmax(200px,1fr))] lg:grid-cols-3 gap-4">
                <div class="sala bg-slate-200 p-2 flex flex-col items-center text-center border border-gray-400 shadow-gray-400 shadow-[1px_1px_0,2px_2px_0,3px_3px_0] hover:scale-105 transition-transform">
                    <p class="text-xl sala-nome">Nome da Sala</p>
                    <p>&#128101; <span class="sala-players text-green-800">1/4</span> • <span class="sala-modo text-red-800">Paulista</span></p>
                    <p class="m-1 mt-2 w-fit hover:scale-110 transition-transform"><a class="p-2 bg-slate-400 cursor-pointer filter" href="#">Entrar</a></p>
                </div>
            </div>
        </div>
    </main>
    <footer class="p-1">
        <p><a href="https://github.com/espinafr/truco-client" target="_blank" rel="noopener noreferrer">Contribua no github!</a></p>
    </footer>
    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="/src/index.ts"></script>
</body>
</html>
